name: Trial bank refresh
run-name: Trial bank refresh, ${{ (github.event.schedule == '23 3 * * 1-6' || github.event.inputs.mode == 'light') && 'daily run' || 'full run' }}

# Two runs share this file.
#   Full run, Sundays: everything below, the open data release, the newsletter and the report by email.
#   Daily run, Monday to Saturday: the registries, registry results, regulators, announcements, the paper reader,
#   the hypothesis ledger and the load. It leaves out the steps marked "full run only": reviews and guidelines,
#   lab evidence, the open data release, the newsletter and the weekly report. It reuses Sunday's download of the
#   EU's old register (about 25 minutes, and closed to new trials since 2023), so it takes about 10 minutes.
# The database keeps Sunday's rows for every table the daily run does not build (see load_supabase.py).
on:
  schedule:
    - cron: "23 3 * * 0"     # Sundays 03:23 UTC: full run
    - cron: "23 3 * * 1-6"   # Monday to Saturday 03:23 UTC: daily run. MODE below compares against this exact text
  workflow_dispatch:
    inputs:
      mode:
        description: "full = everything, as on Sundays. light = the daily run"
        type: choice
        options:
          - full
          - light
        default: full
      load:
        description: "Load into Supabase after building"
        type: boolean
        default: true
      newsletter:
        description: "Send the newsletter now (otherwise a manual run only saves a draft in Buttondown)"
        type: boolean
        default: false
      readout_max:
        description: "Most paper readings in this run (the weekly run uses 400)"
        type: string
        default: "400"

permissions:
  contents: write

# this workflow and the daily news run both commit to this repository: never run them at the same time
concurrency:
  group: msfrontier-writes
  cancel-in-progress: false   # lets the run commit the machine-read paper results (readouts/) back to this repository

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MODE: ${{ (github.event.schedule == '23 3 * * 1-6' || github.event.inputs.mode == 'light') && 'light' || 'full' }}
    defaults:
      run:
        working-directory: trialbank
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      # ChEMBL and Europe PMC lookups are cached between runs so only new names/IDs are queried.
      # raw/euctr_full.txt is the last download of the EU's old register, which the daily run reuses.
      - name: Restore lookup caches
        uses: actions/cache@v5
        with:
          path: |
            trialbank/raw/chembl_cache.json
            trialbank/raw/europepmc_cache.json
            trialbank/raw/opentargets_cache.json
            trialbank/raw/abstracts_cache.json
            trialbank/raw/ema
            trialbank/raw/conference_cache.json
            trialbank/raw/announcements_cache.json
            trialbank/raw/euctr_full.txt
          key: trialbank-lookups-${{ github.run_id }}
          restore-keys: trialbank-lookups-

      - name: Harvest, tag and build
        id: harvest
        run: |
          cd scripts
          # registry websites sometimes time out: try each download up to 3 times before giving up
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed, retrying in 2 minutes"; sleep 120; done; return 1; }
          retry python harvest_ctgov.py ../raw
          retry python harvest_isrctn.py ../raw
          # The daily run reuses the last download of the EU's old register when the cache holds one that is
          # less than 9 days old. Without one it downloads the register like the full run.
          if [ "$MODE" = "light" ] && [ -n "$(find ../raw/euctr_full.txt -mtime -9 -size +1000k 2>/dev/null)" ]; then
            echo "EU old register: using the download of $(date -u -r ../raw/euctr_full.txt +%Y-%m-%d)"
          else
            retry python harvest_euctr.py ../raw
          fi
          retry python harvest_ctis.py ../raw
          python warm_chembl_all.py
          python build.py
          python europepmc.py
          python build.py
          python results_layer.py
          python treatments_layer.py
          python measures_layer.py
          python links_layer.py
          python validate.py > ../data/validate.log

      # Hypothesis ledger. Genetics and paper readouts are optional: if either fails, the ledger is still built and
      # the database keeps last week's genetics/readouts.
      # Results presented at conferences and announced by sponsors, matched to trials: provisional, never a verdict.
      # Both are optional: if either fails the run continues and the database keeps last week's rows.
      - name: Conference reports (AAN abstracts)
        continue-on-error: true
        env:
          CONF_MEETINGS: AAN2026
        run: cd scripts && python conference_layer.py

      - name: Company and conference announcements as provisional results
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd scripts && python announcements_layer.py

      - name: Genetic leads (Open Targets)
        id: genetics
        continue-on-error: true
        run: cd scripts && python genetics_layer.py

      - name: Read results from papers (needs ANTHROPIC_API_KEY)
        id: readouts
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          READOUT_MAX_TRIALS: ${{ github.event.inputs.readout_max || '400' }}
        run: cd scripts && python readouts_layer.py

      # How much each treatment changed the main measures: registry analyses plus the papers read above. No API calls.
      - name: Effect sizes
        continue-on-error: true
        run: cd scripts && python effects_layer.py

      - name: Build hypothesis ledger
        id: hypotheses
        run: cd scripts && python hypotheses_layer.py

      - name: Trials to watch
        id: highlights
        continue-on-error: true
        run: cd scripts && python highlights_layer.py

      - name: Results watch (finished trials without results)
        id: results_watch
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd scripts && python results_watch_layer.py

      # Reviews and guidelines from Europe PMC, tagged by a model. Optional: if it fails, the bank keeps last week's.
      # Full run only.
      - name: Reviews and guidelines (needs ANTHROPIC_API_KEY)
        id: literature
        if: ${{ env.MODE == 'full' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd scripts && python literature_layer.py

      # Lab evidence: animal and human cell studies from Europe PMC, tagged by a model. Optional, like the reviews.
      # Tagging stops after PRE_MAX_MINUTES and continues on the next run, so the first weeks fill it in stages.
      # Full run only.
      - name: Lab evidence (needs ANTHROPIC_API_KEY)
        id: preclinical
        if: ${{ env.MODE == 'full' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRE_MAX_MINUTES: "75"
          PRE_WORKERS: "8"
        run: cd scripts && python preclinical_layer.py

      # Saving the readouts must never stop the load: if it fails, the next run simply re-reads those papers.
      # --autostash: the build rewrites tracked data files, so the tree is never clean when someone has pushed
      # to the repository during the run.
      - name: Save machine-read paper results to the repository
        id: save_readouts
        continue-on-error: true
        run: |
          cd ..
          if [ -n "$(git status --porcelain trialbank/readouts)" ]; then
            git config user.name "trialbank-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trialbank/readouts
            git commit -m "Paper readouts [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              sleep 10
            done
          fi

      - name: Load into Supabase
        id: load
        if: ${{ github.event_name == 'schedule' || inputs.load }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cd scripts
          python load_supabase.py ../data

      # The site's pages read stored views (materialised views) that hold the bank as it was when they were last
      # refreshed. Refresh them after every load, or the pages keep showing the previous load. Needs migration 036;
      # before it the step says so and does nothing. A failure stops the daily run, so that the alert goes out.
      # The full run carries on and names the step in the weekly report.
      - name: Refresh the site's stored views
        id: site_views
        if: ${{ steps.load.outcome == 'success' }}
        continue-on-error: ${{ env.MODE == 'full' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: cd scripts && python refresh_site.py

      # Organisations (companies and institutions working on MS). Runs once scripts/organisations.py from the
      # organisations package is in the repository, and writes organisations.csv into data/ for the open data.
      - name: Organisations
        id: organisations
        if: ${{ steps.load.outcome == 'success' && env.MODE == 'full' }}
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -f scripts/organisations.py ]; then python scripts/organisations.py --out data; else echo "organisations.py not uploaded yet"; fi

      # Open data: CSVs, a data dictionary and one zip, published as a GitHub release with stable file names, so
      # https://github.com/<owner>/<repo>/releases/latest/download/msfrontier-data.zip is always the newest build.
      # Full run only: one release a week.
      - name: Build the open data exports
        id: exports
        if: ${{ env.MODE == 'full' }}
        continue-on-error: true
        run: |
          cd scripts
          python export_layer.py

      - name: Publish the open data release
        id: release
        if: ${{ env.MODE == 'full' && (github.event_name == 'schedule' || inputs.load) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$(date -u +%Y-%m-%d)"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" exports/*.zip exports/*.csv exports/README.md \
            --title "MSFrontier open data $(date -u +%Y-%m-%d)" --notes-file exports/README.md --latest

      # Weekly newsletter through Buttondown. The Sunday run sends it (unless the repository variable NEWSLETTER_MODE
      # is set to draft or off). A manual run saves a draft, or sends if "Send the newsletter now" is ticked.
      # Full run only: the daily run never sends or drafts a newsletter.
      - name: Send the newsletter
        id: newsletter
        if: ${{ steps.load.outcome == 'success' && env.MODE == 'full' }}
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          NEWSLETTER_MODE: ${{ github.event_name == 'schedule' && (vars.NEWSLETTER_MODE || 'send') || (inputs.newsletter && 'send' || 'draft') }}
        run: cd scripts && python newsletter.py

      # A short report to Marcus after every full run, including runs that failed part-way.
      - name: Email the weekly report
        if: ${{ always() && env.MODE == 'full' }}
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STEPS_JSON: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: cd scripts && python alerts.py --weekly

      # The daily run sends no report. It sends an alert when it fails.
      - name: Email an alert if the daily run failed
        if: ${{ failure() && env.MODE == 'light' }}
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: cd scripts && python alerts.py --failure "Trial bank refresh, daily run"

      - name: Keep the built files
        uses: actions/upload-artifact@v5
        with:
          name: trialbank-data
          path: trialbank/data/
          retention-days: ${{ env.MODE == 'full' && 30 || 7 }}
