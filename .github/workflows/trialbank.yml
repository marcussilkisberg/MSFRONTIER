name: Trial bank refresh

on:
  schedule:
    - cron: "23 3 * * 0"   # Sundays 03:23 UTC
  workflow_dispatch:
    inputs:
      load:
        description: "Load into Supabase after building"
        type: boolean
        default: true
      newsletter:
        description: "Send the newsletter now (otherwise a manual run only saves a draft in Buttondown)"
        type: boolean
        default: false

permissions:
  contents: write

# the weekly run and the daily news run both commit to this repository: never run them at the same time
concurrency:
  group: msfrontier-writes
  cancel-in-progress: false   # lets the run commit the machine-read paper results (readouts/) back to this repository

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: trialbank
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      # ChEMBL and Europe PMC lookups are cached between runs so only new names/IDs are queried
      - name: Restore lookup caches
        uses: actions/cache@v5
        with:
          path: |
            trialbank/raw/chembl_cache.json
            trialbank/raw/europepmc_cache.json
            trialbank/raw/opentargets_cache.json
            trialbank/raw/abstracts_cache.json
          key: trialbank-lookups-${{ github.run_id }}
          restore-keys: trialbank-lookups-

      - name: Harvest, tag and build
        id: harvest
        run: |
          cd scripts
          # registry websites sometimes time out: try each download up to 3 times before giving up
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed, retrying in 2 minutes"; sleep 120; done; return 1; }
          retry python harvest_ctgov.py ../raw
          retry python harvest_isrctn.py ../raw
          retry python harvest_euctr.py ../raw
          retry python harvest_ctis.py ../raw
          python warm_chembl_all.py
          python build.py
          python europepmc.py
          python build.py
          python results_layer.py
          python treatments_layer.py
          python measures_layer.py
          python links_layer.py
          python validate.py > ../data/validate.log

      # Hypothesis ledger. Genetics and paper readouts are optional: if either fails, the ledger is still built and
      # the database keeps last week's genetics/readouts.
      - name: Genetic leads (Open Targets)
        id: genetics
        continue-on-error: true
        run: cd scripts && python genetics_layer.py

      - name: Read results from papers (needs ANTHROPIC_API_KEY)
        id: readouts
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          READOUT_MAX_TRIALS: "400"
        run: cd scripts && python readouts_layer.py

      - name: Build hypothesis ledger
        id: hypotheses
        run: cd scripts && python hypotheses_layer.py

      - name: Results watch (finished trials without results)
        id: results_watch
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd scripts && python results_watch_layer.py

      # Reviews and guidelines from Europe PMC, tagged by a model. Optional: if it fails, the bank keeps last week's.
      - name: Reviews and guidelines (needs ANTHROPIC_API_KEY)
        id: literature
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd scripts && python literature_layer.py

      # Saving the readouts must never stop the load: if it fails, the next run simply re-reads those papers.
      # --autostash: the build rewrites tracked data files, so the tree is never clean when someone has pushed
      # to the repository during the run.
      - name: Save machine-read paper results to the repository
        id: save_readouts
        continue-on-error: true
        run: |
          cd ..
          if [ -n "$(git status --porcelain trialbank/readouts)" ]; then
            git config user.name "trialbank-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trialbank/readouts
            git commit -m "Weekly paper readouts [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              sleep 10
            done
          fi

      - name: Load into Supabase
        id: load
        if: ${{ github.event_name == 'schedule' || inputs.load }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cd scripts
          python load_supabase.py ../data

      # Open data: CSVs, a data dictionary and one zip, published as a GitHub release with stable file names, so
      # https://github.com/<owner>/<repo>/releases/latest/download/msfrontier-data.zip is always the newest build.
      - name: Build the open data exports
        id: exports
        continue-on-error: true
        run: |
          cd scripts
          python export_layer.py

      - name: Publish the open data release
        id: release
        if: ${{ github.event_name == 'schedule' || inputs.load }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$(date -u +%Y-%m-%d)"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" exports/*.zip exports/*.csv exports/README.md \
            --title "MSFrontier open data $(date -u +%Y-%m-%d)" --notes-file exports/README.md --latest

      # Weekly newsletter through Buttondown. The Sunday run sends it (unless the repository variable NEWSLETTER_MODE
      # is set to draft or off). A manual run saves a draft, or sends if "Send the newsletter now" is ticked.
      - name: Send the newsletter
        id: newsletter
        if: ${{ steps.load.outcome == 'success' }}
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          NEWSLETTER_MODE: ${{ github.event_name == 'schedule' && (vars.NEWSLETTER_MODE || 'send') || (inputs.newsletter && 'send' || 'draft') }}
        run: cd scripts && python newsletter.py

      # A short report to Marcus after every run, including runs that failed part-way.
      - name: Email the weekly report
        if: ${{ always() }}
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STEPS_JSON: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: cd scripts && python alerts.py --weekly

      - name: Keep the built files
        uses: actions/upload-artifact@v5
        with:
          name: trialbank-data
          path: trialbank/data/
          retention-days: 30
