# Hypotheses the Project registers BEFORE testing them. Each therapeutic hypothesis names an aim, an approach and a
# population using the ledger's own codes, so it joins the matching ledger entry (and every trial behind it)
# automatically. Never list trial IDs here.
#   aim:        prevent | stop_inflammation | slow_progression | protect_nerves | repair | restore_function | reset
#   approach:   a mechanism node id (see data/mechanism_nodes.csv), nd-<category>, or new-<slug> for an approach
#               no trial has tested yet (then give approach_label)
#   population: ppms | spms | progressive | relapsing | relapsing_and_progressive | early_cis_ris | unspecified |
#               nmosd | mogad | optic_neuritis
#   kind:       therapeutic (joins the ledger) | method (about how trials are run; shown with the study only)
#   status:     registered | analysis_plan_published | in_analysis | result_published
- id: P-03-H1
  study: P-03
  kind: therapeutic
  statement: People with progressive MS who take statins worsen more slowly.
  aim: slow_progression
  approach: vascular_lipid
  population: progressive
  drugs: [simvastatin, atorvastatin, rosuvastatin]
  status: registered
  registered_on: 2026-10-27
